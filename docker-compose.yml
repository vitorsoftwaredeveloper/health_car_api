services:
  mongo:
    image: mongo:6.0-jammy
    container_name: health_car_mongo_local
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  localstack:
    image: localstack/localstack:3.5
    container_name: health_car_localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,ssm
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "0"
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal s3api head-bucket --bucket health-car-api-local-attachments && awslocal sqs get-queue-url --queue-name health-car-api-local-notifications",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

volumes:
  mongo_data:
  localstack_data:
