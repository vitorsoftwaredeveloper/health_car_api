service: health-car-api
frameworkVersion: "3"
configValidationMode: error

plugins:
  - serverless-esbuild
  - serverless-offline

package:
  individually: true

custom:
  config: ${file(config/local.json)}
  esbuild: ${file(esbuild.config.js)}
  serverless-offline:
    httpPort: 4000
    lambdaPort: 4002
    noPrependStageInUrl: true
    noAuth: true

provider:
  name: aws
  runtime: nodejs24.x
  stage: local
  region: ${self:custom.config.environment.REGION}
  memorySize: 512
  timeout: 29
  environment: ${self:custom.config.environment}
  httpApi:
    cors: true
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_local
        audience:
          - local-client-id

functions:
  - ${file(src/handlers/system/functions.yml)}
  - ${file(src/handlers/users/functions.yml)}
  - ${file(src/handlers/vehicles/functions.yml)}
  - ${file(src/handlers/catalog/functions.yml)}
  - ${file(src/handlers/plan/functions.yml)}
  - ${file(src/handlers/odometer/functions.yml)}
